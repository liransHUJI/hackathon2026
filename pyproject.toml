[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name            = "provenance-pipeline"
version         = "0.1.0"
description     = "Traces the origin of news headlines and detects AI-generated disinformation."
requires-python = ">=3.11"

dependencies = [
    # ── LLM ──────────────────────────────────────────────────────────────────
    "anthropic>=0.40.0",

    # ── Data contracts ────────────────────────────────────────────────────────
    "pydantic>=2.0",
    "pydantic-settings>=2.0",

    # ── Async HTTP + scraping ─────────────────────────────────────────────────
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12",
    "duckduckgo-search>=6.0",

    # ── Semantic similarity ───────────────────────────────────────────────────
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "scipy>=1.13",

    # ── Ingestion sources ─────────────────────────────────────────────────────
    "feedparser>=6.0",
    "python-dateutil>=2.9",

    # ── Utilities ─────────────────────────────────────────────────────────────
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff",
    "mypy",
]

[project.scripts]
provenance = "main:main"

# ── Package discovery ──────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where   = ["."]
include = ["src*"]

# ── Ruff (linting + formatting) ───────────────────────────────────────────────
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]   # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
strict         = true
files          = ["src/"]
python_version = "3.11"

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
