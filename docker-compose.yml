services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: provenance
      POSTGRES_USER: provenance
      POSTGRES_PASSWORD: provenance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provenance -d provenance"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./services/go-backend
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://provenance:provenance@postgres:5432/provenance?sslmode=disable"
      NATS_URL: "nats://nats:4222"
      RETENTION_DAYS: "7"
      DEFAULT_TOP_NARRATIVES: "20"
      INTERACTIONS_PER_NARRATIVE: "2000"
      CRAWL_INTERVAL_SECONDS: "900"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      BRIGHTDATA_API_KEY: "${BRIGHTDATA_API_KEY:-}"
      BRIGHTDATA_UNLOCKER_ZONE: "${BRIGHTDATA_UNLOCKER_ZONE:-}"
      BRIGHTDATA_X_DATASET_ID: "${BRIGHTDATA_X_DATASET_ID:-}"
      BRIGHTDATA_SEARCH_DATASET_ID: "${BRIGHTDATA_SEARCH_DATASET_ID:-}"
      BRIGHTDATA_BUDGET_USD: "${BRIGHTDATA_BUDGET_USD:-75}"
      BRIGHTDATA_X_REQUESTS_PER_MINUTE: "${BRIGHTDATA_X_REQUESTS_PER_MINUTE:-30}"
      BRIGHTDATA_WEB_REQUESTS_PER_MINUTE: "${BRIGHTDATA_WEB_REQUESTS_PER_MINUTE:-30}"
      BASIC_WEB_DOMAIN_RPS: "${BASIC_WEB_DOMAIN_RPS:-2}"
      GPTZERO_API_KEY: "${GPTZERO_API_KEY:-}"
      SAPLING_API_KEY: "${SAPLING_API_KEY:-}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

volumes:
  postgres_data:
  nats_data:
